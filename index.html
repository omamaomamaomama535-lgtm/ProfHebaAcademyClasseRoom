<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أكاديمية النجاح - المنصة التعليمية</title>
    
    <!-- مكتبات التصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبات سيرفر Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- ستايل الموقع المدمج -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        :root { --primary: #4f46e5; --primary-dark: #4338ca; --secondary: #10b981; --bg-color: #f3f4f6; --surface: #ffffff; --text-main: #1f2937; --text-muted: #6b7280; }
        * { -webkit-tap-highlight-color: transparent; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; padding-bottom: 80px; }
        .hidden-section { display: none !important; }
        .btn-touch { transition: transform 0.1s ease, box-shadow 0.1s ease; }
        .btn-touch:active { transform: scale(0.97); }

        .mobile-card { background: var(--surface); border-radius: 16px; padding: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 1rem; border: 1px solid #e5e7eb; }
        .mobile-input { width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid #d1d5db; background-color: #f9fafb; font-size: 1rem; margin-top: 0.5rem; transition: border-color 0.2s; }
        .mobile-input:focus { outline: none; border-color: var(--primary); background-color: var(--surface); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); box-shadow: 0 -4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-around; padding: 0.75rem 0.5rem; padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); z-index: 50; border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 0.75rem; font-weight: 500; width: 25%; transition: color 0.2s; }
        .nav-item i { font-size: 1.5rem; margin-bottom: 0.25rem; padding: 0.5rem; border-radius: 50%; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { background-color: #e0e7ff; color: var(--primary-dark); }

        .schedule-wrapper { overflow-x: auto; border-radius: 12px; background: white; -webkit-overflow-scrolling: touch; }
        .schedule-table { width: 100%; min-width: 600px; border-collapse: collapse; }
        .schedule-table th, .schedule-table td { border: 1px solid #f3f4f6; padding: 1rem 0.5rem; text-align: center; }
        .schedule-table th { background-color: #f9fafb; font-weight: 700; color: var(--text-muted); }
        .schedule-cell { font-size: 0.875rem; font-weight: 500; }
        .schedule-cell.filled { background-color: #e0e7ff; color: var(--primary-dark); font-weight: 700; }
        
        .bottom-sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .bottom-sheet-overlay.active { opacity: 1; pointer-events: auto; }
        .bottom-sheet-content { background: #f8fafc; width: 100%; max-height: 90vh; overflow-y: auto; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 2rem 1.5rem; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1); }
        .bottom-sheet-overlay.active .bottom-sheet-content { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 5px; background: #cbd5e1; border-radius: 10px; margin: -1rem auto 1.5rem auto; }

        .app-header { background: var(--primary); color: white; padding: 1rem; padding-top: calc(1rem + env(safe-area-inset-top)); border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2); position: sticky; top: 0; z-index: 40; }

        .login-bg { background: linear-gradient(135deg, var(--primary) 0%, #312e81 100%); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; }
        .login-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 24px; padding: 2.5rem 1.5rem; width: 100%; max-width: 400px; text-align: center; }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
        .custom-toast { background: white; border-radius: 12px; padding: 12px 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 12px; animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, fadeOut 0.4s ease 3s forwards; pointer-events: auto; border: 1px solid #e5e7eb; }
        .custom-toast.success { border-right: 5px solid #10b981; } .custom-toast.error { border-right: 5px solid #ef4444; } .custom-toast.info { border-right: 5px solid #3b82f6; }
        @keyframes slideDown { 0% { opacity: 0; transform: translateY(-30px); } 100% { opacity: 1; transform: translateY(0); } } @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0; display: none; } }

        #confirm-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        #confirm-modal.active { opacity: 1; pointer-events: auto; }
        .confirm-box { background: white; padding: 24px; border-radius: 20px; width: 90%; max-width: 350px; transform: scale(0.9); transition: transform 0.2s; text-align: center; }
        #confirm-modal.active .confirm-box { transform: scale(1); }
        
        #loader-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.3s; }
    </style>
</head>
<body>

    <div id="toast-container"></div>
    <div id="loader-overlay" class="hidden-section"><i class="fas fa-circle-notch fa-spin text-5xl text-indigo-600 mb-4"></i><h2 class="text-xl font-bold text-gray-800">جاري الاتصال...</h2></div>

    <div id="confirm-modal"><div class="confirm-box shadow-2xl"><div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-exclamation-triangle text-3xl text-red-500"></i></div><h3 id="confirm-msg" class="font-bold text-gray-800 text-lg mb-6">هل أنت متأكد؟</h3><div class="flex gap-3"><button onclick="closeConfirmModal()" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl btn-touch">إلغاء</button><button id="confirm-btn-yes" class="flex-1 bg-red-600 text-white font-bold py-3 rounded-xl btn-touch shadow-lg">نعم</button></div></div></div>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="login-bg hidden-section">
        <div class="login-card">
            <div class="bg-indigo-100 w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-6 shadow-sm"><i class="fas fa-graduation-cap text-5xl text-indigo-600"></i></div>
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">أكاديمية النجاح</h1>
            <p class="text-gray-500 mb-8 text-sm">متصل بالسيرفر السحابي</p>
            <div id="g_id_onload" data-client_id="1018216640680-80fo3j734dq1slms7rf392sbgeo28f8n.apps.googleusercontent.com" data-callback="handleGoogleLogin"></div>
            <div class="g_id_signin flex justify-center mb-6" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="pill"></div>
        </div>
    </div>

    <!-- المنصة الرئيسية -->
    <div id="main-dashboard" class="hidden-section">
        <header class="app-header flex justify-between items-center">
            <div class="flex items-center gap-3"><div class="bg-white/20 p-2 rounded-full backdrop-blur-sm"><i class="fas fa-user text-xl"></i></div><div><h2 id="user-name-display" class="font-bold text-sm leading-tight">اسم المستخدم</h2><span id="user-role-badge" class="text-xs text-indigo-200">الدور</span></div></div>
            <button onclick="logout()" class="p-2 bg-white/10 rounded-full hover:bg-red-500/80 transition btn-touch"><i class="fas fa-sign-out-alt text-xl"></i></button>
        </header>

        <main class="p-4" id="content-area">
            
            <!-- [1] الإدارة -->
            <div id="view-admin" class="hidden-section pb-20">
                <h2 class="text-2xl font-bold mb-4 flex items-center gap-2"><i class="fas fa-server text-red-500"></i> إدارة السيرفر</h2>
                <div class="mobile-card border-t-4 border-t-red-500">
                    <h3 class="font-bold mb-4">إضافة مستخدم للسيرفر</h3>
                    <div><label class="text-sm font-bold text-gray-600 ml-1">الاسم</label><input type="text" id="add-user-name" class="mobile-input"></div>
                    <div class="mt-4"><label class="text-sm font-bold text-gray-600 ml-1">الإيميل</label><input type="email" id="add-user-email" class="mobile-input text-left" dir="ltr"></div>
                    <div class="mt-4"><label class="text-sm font-bold text-gray-600 ml-1">الصلاحية</label><select id="add-user-role" class="mobile-input bg-white"><option value="student">طالب</option><option value="teacher">معلم</option><option value="admin">مدير</option></select></div>
                    <button onclick="addUser()" class="btn-touch w-full mt-6 bg-red-600 text-white font-bold py-3 rounded-xl shadow-md"><i class="fas fa-cloud-upload-alt ml-1"></i> حفظ</button>
                </div>
                <h3 class="font-bold mt-6 mb-3 ml-2 text-gray-700">المسجلون بالسيرفر</h3>
                <div id="admin-users-list" class="space-y-3"></div>
            </div>

            <!-- [2] الواجبات -->
            <div id="view-homework-manage" class="hidden-section pb-20">
                <div class="flex bg-gray-200 p-1 rounded-xl mb-6"><button onclick="switchTeacherTab('publish')" id="tab-t-publish" class="flex-1 py-2 font-bold rounded-lg text-sm bg-white text-indigo-600">نشر واجب</button><button onclick="switchTeacherTab('track')" id="tab-t-track" class="flex-1 py-2 font-bold rounded-lg text-sm text-gray-500">التسليمات</button></div>
                <div id="teacher-publish-view">
                    <div class="mobile-card border-t-4 border-t-indigo-500">
                        <div><label class="text-sm font-bold text-gray-600 ml-1">عنوان الواجب</label><input type="text" id="hw-title" class="mobile-input"></div>
                        <div class="mt-4"><label class="text-sm font-bold text-gray-600 ml-1">آخر موعد</label><input type="date" id="hw-date" class="mobile-input"></div>
                        <div class="mt-4"><label class="text-sm font-bold text-gray-600 ml-1">الصف</label><select id="hw-grade" class="mobile-input bg-white"><option value="">- حدد الصف -</option><optgroup label="الابتدائي"><option value="الأول الابتدائي">الأول الابتدائي</option><option value="الثاني الابتدائي">الثاني الابتدائي</option><option value="السادس الابتدائي">السادس الابتدائي</option></optgroup><optgroup label="الإعدادي"><option value="الأول الإعدادي">الأول الإعدادي</option><option value="الثالث الإعدادي">الثالث الإعدادي</option></optgroup><optgroup label="الثانوي"><option value="الأول الثانوي">الأول الثانوي</option><option value="الثالث الثانوي">الثالث الثانوي</option></optgroup></select></div>
                        <div class="mt-4"><label class="text-sm font-bold text-gray-600 ml-1">المادة</label><select id="hw-subject" class="mobile-input bg-white"><option value="">- حدد المادة -</option><option value="اللغة العربية">اللغة العربية</option><option value="الرياضيات">الرياضيات</option><option value="الفيزياء">الفيزياء</option><option value="أخرى">أخرى</option></select></div>
                        <div class="mt-4"><label class="text-sm font-bold text-gray-600 ml-1">التعليمات</label><textarea id="hw-desc" rows="3" class="mobile-input resize-none"></textarea></div>
                        <button onclick="addHomework()" class="btn-touch w-full mt-6 bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-md"><i class="fas fa-paper-plane"></i> نشر</button>
                    </div>
                </div>
                <div id="teacher-track-view" class="hidden-section"><div id="teacher-hw-list" class="space-y-4"></div></div>
            </div>

            <!-- [3] الجدول -->
            <div id="view-schedule-manage" class="hidden-section pb-20">
                <h2 class="text-2xl font-bold mb-4 flex items-center gap-2"><i class="fas fa-calendar-alt text-purple-500"></i> تنظيم الجدول</h2>
                <div class="mobile-card border-t-4 border-t-purple-500 mb-6 bg-purple-50">
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-xs font-bold text-gray-600">اليوم</label><select id="sch-day" class="mobile-input py-2 mt-1 bg-white"><option value="السبت">السبت</option><option value="الأحد">الأحد</option><option value="الإثنين">الإثنين</option><option value="الثلاثاء">الثلاثاء</option><option value="الأربعاء">الأربعاء</option><option value="الخميس">الخميس</option></select></div>
                        <div><label class="text-xs font-bold text-gray-600">الحصة</label><select id="sch-slot" class="mobile-input py-2 mt-1 bg-white"><option value="1">الأولى</option><option value="2">الثانية</option><option value="3">الثالثة</option><option value="4">الرابعة</option><option value="5">الخامسة</option></select></div>
                    </div>
                    <div class="mt-3"><label class="text-xs font-bold text-gray-600">المادة والصف</label><input type="text" id="sch-subject" class="mobile-input py-2 mt-1 bg-white"></div>
                    <div class="flex gap-2 mt-4">
                        <button onclick="addScheduleSlot()" class="btn-touch flex-grow bg-purple-600 text-white font-bold py-2 rounded-xl"><i class="fas fa-save ml-1"></i> حفظ</button>
                        <button onclick="clearSchedule()" class="btn-touch w-12 bg-red-100 text-red-600 font-bold rounded-xl"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
                <div id="manage-schedule-container"></div>
            </div>

            <!-- [4] الطالب -->
            <div id="view-student" class="hidden-section pb-20">
                <div class="flex bg-gray-200 p-1 rounded-xl mb-6"><button onclick="switchStudentTab('hw')" id="tab-hw" class="flex-1 py-2 font-bold rounded-lg text-sm bg-white text-indigo-600">الواجبات</button><button onclick="switchStudentTab('sch')" id="tab-sch" class="flex-1 py-2 font-bold rounded-lg text-sm text-gray-500">الجدول</button></div>
                <div id="student-hw-list" class="space-y-4"></div>
                <div id="student-schedule-view" class="hidden-section"><div id="display-schedule-container"></div></div>
            </div>
        </main>
        <nav id="bottom-nav" class="bottom-nav"></nav>
    </div>

    <!-- النوافذ المنبثقة -->
    <div id="submit-sheet" class="bottom-sheet-overlay"><div class="bottom-sheet-content"><div class="sheet-handle"></div><div class="flex justify-between items-center mb-6"><h3 class="text-xl font-bold text-gray-800">تسليم الواجب</h3><button onclick="closeSheet('submit-sheet')" class="p-2 bg-gray-100 rounded-full btn-touch"><i class="fas fa-times"></i></button></div><div class="space-y-5"><div class="bg-indigo-50 border p-3 rounded-lg"><p id="sheet-hw-title" class="font-bold text-indigo-900 text-sm"></p></div><div><label class="block font-bold text-sm text-gray-600 mb-2">إجابة نصية:</label><textarea id="submit-text" class="mobile-input resize-none" rows="3"></textarea></div><div><label class="block font-bold text-sm text-gray-600 mb-2">إرفاق ملف:</label><div class="relative border-2 border-dashed border-gray-300 rounded-xl p-4 text-center hover:bg-gray-50 transition"><input type="file" id="submit-file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="updateFileName(this)" accept=".pdf, image/png, image/jpeg"><i class="fas fa-cloud-upload-alt text-3xl text-gray-400 mb-2"></i><p id="file-name-display" class="text-sm font-bold text-indigo-600">اختر ملف</p></div></div><button id="confirm-submit-btn" onclick="confirmSubmission()" class="btn-touch w-full bg-emerald-600 text-white font-bold py-4 rounded-xl mt-4">تأكيد الرفع</button></div></div></div>
    <div id="teacher-view-sheet" class="bottom-sheet-overlay"><div class="bottom-sheet-content" style="max-height: 95vh;"><div class="sheet-handle"></div><div class="flex justify-between items-center mb-4 border-b pb-3"><h3 class="text-xl font-bold text-indigo-800">التسليمات</h3><button onclick="closeSheet('teacher-view-sheet')" class="p-2 bg-gray-100 rounded-full btn-touch"><i class="fas fa-times"></i></button></div><div id="submissions-container" class="space-y-3"></div></div></div>
    <div id="file-viewer-modal" class="bottom-sheet-overlay" style="z-index: 2000;"><div class="bottom-sheet-content" style="height: 90vh; display: flex; flex-direction: column; padding: 1rem;"><div class="sheet-handle"></div><div class="flex justify-between items-center mb-4"><h3 class="font-bold text-gray-800">معاينة الملف</h3><button onclick="closeSheet('file-viewer-modal')" class="p-2 bg-gray-100 rounded-full text-red-500 btn-touch"><i class="fas fa-times"></i> إغلاق</button></div><div id="file-viewer-container" class="flex-grow w-full bg-gray-100 rounded-lg overflow-hidden flex items-center justify-center p-2"></div></div></div>

    <!-- استدعاء ملف الأكواد الخارجي هنا -->
    <script src="app.js"></script>

</body>
</html>
