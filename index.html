<!DOCTYPE html>
<html lang="it" dir="ltr" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Accademia del Successo</title>
    
    <!-- مكتبات التصميم وجوجل -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبات سيرفر Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap');
        
        /* المتغيرات الأساسية للمظهر الفاتح والداكن */
        :root { 
            --primary: #2563eb; --primary-dark: #1d4ed8; --secondary: #10b981; 
            --bg-color: #f8fafc; --surface: #ffffff; --text-main: #0f172a; --text-muted: #64748b; 
            --border-color: #e2e8f0; --input-bg: #f8fafc; --nav-active-bg: #eff6ff;
            --font-en: 'Inter', sans-serif; --font-ar: 'Tajawal', sans-serif;
        }
        
        body.dark-mode {
            --bg-color: #0f172a; --surface: #1e293b; --text-main: #f1f5f9; --text-muted: #94a3b8; 
            --border-color: #334155; --input-bg: #0f172a; --nav-active-bg: #334155;
        }

        * { -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); color: var(--text-main); 
            overflow-x: hidden; padding-bottom: 80px; transition: background-color 0.3s, color 0.3s;
        }
        
        /* الخطوط تتغير حسب اللغة */
        body[dir="ltr"] { font-family: var(--font-en); }
        body[dir="rtl"] { font-family: var(--font-ar); }

        .hidden-section { display: none !important; }
        .btn-touch { transition: transform 0.1s ease; }
        .btn-touch:active { transform: scale(0.96); }

        /* العناصر الأساسية متجاوبة مع الوضع الداكن */
        .mobile-card { background: var(--surface); border-radius: 16px; padding: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 1rem; border: 1px solid var(--border-color); transition: all 0.3s;}
        .mobile-input { width: 100%; padding: 0.875rem 1rem; border-radius: 12px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-main); font-size: 1rem; margin-top: 0.5rem; transition: border-color 0.2s; }
        .mobile-input:focus { outline: none; border-color: var(--primary); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 0.75rem 0.5rem; padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); z-index: 50; transition: all 0.3s;}
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 0.75rem; font-weight: 600; width: 25%; transition: color 0.2s; cursor: pointer;}
        .nav-item i { font-size: 1.25rem; margin-bottom: 0.25rem; padding: 0.5rem; border-radius: 50%; transition: background-color 0.2s;}
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { background-color: var(--nav-active-bg); color: var(--primary); }

        .app-header { background: var(--surface); color: var(--text-main); padding: 1rem; padding-top: calc(1rem + env(safe-area-inset-top)); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 40; transition: all 0.3s;}
        
        .login-bg { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);}
        .login-card { background: var(--surface); border-radius: 24px; padding: 2.5rem 2rem; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); position: relative;}

        /* الجداول والنوافذ */
        .schedule-wrapper { overflow-x: auto; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-color); -webkit-overflow-scrolling: touch; }
        .schedule-table { width: 100%; min-width: 600px; border-collapse: collapse; }
        .schedule-table th, .schedule-table td { border: 1px solid var(--border-color); padding: 0.875rem 0.5rem; text-align: center; color: var(--text-main); }
        .schedule-table th { background-color: var(--input-bg); font-weight: 600; color: var(--text-muted); }
        .schedule-cell.filled { background-color: var(--nav-active-bg); color: var(--primary); font-weight: 600; }

        .bottom-sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(2px);}
        .bottom-sheet-overlay.active { opacity: 1; pointer-events: auto; }
        .bottom-sheet-content { background: var(--surface); color: var(--text-main); width: 100%; max-height: 90vh; overflow-y: auto; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 2rem 1.5rem; transform: translateY(100%); transition: transform 0.3s ease-out; }
        .bottom-sheet-overlay.active .bottom-sheet-content { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 5px; background: var(--border-color); border-radius: 10px; margin: -1rem auto 1.5rem auto; }

        #loader-overlay { position: fixed; inset: 0; background: var(--surface); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.3s; }
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 4000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
        .custom-toast { background: var(--surface); border-radius: 12px; padding: 12px 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px; animation: slideDown 0.4s ease forwards, fadeOut 0.4s ease 3s forwards; pointer-events: auto; border: 1px solid var(--border-color); color: var(--text-main); }
        @keyframes slideDown { 0% { opacity: 0; transform: translateY(-30px); } 100% { opacity: 1; transform: translateY(0); } } @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0; display: none; } }

        /* أزرار الإعدادات العائمة */
        .settings-float { position: absolute; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; }
        body[dir="rtl"] .settings-float { right: auto; left: 1rem; }
        .icon-btn { background: var(--input-bg); color: var(--text-main); width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 1px solid var(--border-color); transition: 0.2s; }
        .icon-btn:hover { background: var(--border-color); }
    </style>
</head>
<body>

    <!-- التنبيهات والتحميل -->
    <div id="toast-container"></div>
    <div id="loader-overlay" class="hidden-section">
        <i class="fas fa-circle-notch fa-spin text-4xl text-blue-600 mb-4"></i>
        <h2 class="text-lg font-semibold" data-i18n="loading">Caricamento in corso...</h2>
    </div>

    <!-- شاشة تسجيل الدخول الرسمية -->
    <div id="login-screen" class="login-bg hidden-section">
        <div class="login-card">
            <!-- أزرار تغيير اللغة والمظهر -->
            <div class="settings-float">
                <button onclick="toggleTheme()" class="icon-btn btn-touch" id="theme-icon"><i class="fas fa-moon"></i></button>
                <button onclick="toggleLang()" class="icon-btn btn-touch font-bold text-xs" id="lang-icon">AR</button>
            </div>

            <div class="bg-blue-50 w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-6 mt-4">
                <i class="fas fa-graduation-cap text-4xl text-blue-600"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2" data-i18n="app_title">Accademia del Successo</h1>
            <p class="text-sm mb-8" style="color: var(--text-muted);" data-i18n="portal_desc">Portale Ufficiale di Accesso</p>
            
            <!-- زر جوجل الرسمي الوحيد -->
            <div id="g_id_onload" data-client_id="1018216640680-80fo3j734dq1slms7rf392sbgeo28f8n.apps.googleusercontent.com" data-callback="handleGoogleLogin"></div>
            <div class="g_id_signin flex justify-center w-full" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular"></div>
        </div>
    </div>

    <!-- المنصة الرئيسية -->
    <div id="main-dashboard" class="hidden-section">
        <header class="app-header flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-100 p-2.5 rounded-full text-blue-600"><i class="fas fa-user"></i></div>
                <div>
                    <h2 id="user-name-display" class="font-bold text-sm leading-tight">Nome Utente</h2>
                    <span id="user-role-badge" class="text-xs font-medium" style="color: var(--text-muted);">Ruolo</span>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleTheme()" class="icon-btn btn-touch"><i class="fas fa-moon" id="header-theme-icon"></i></button>
                <button onclick="toggleLang()" class="icon-btn btn-touch font-bold text-xs" id="header-lang-icon">AR</button>
                <button onclick="logout()" class="icon-btn btn-touch text-red-500 hover:bg-red-50 hover:border-red-200"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <main class="p-4 md:p-6 lg:max-w-4xl lg:mx-auto" id="content-area">
            
            <!-- [1] الإدارة -->
            <div id="view-admin" class="hidden-section pb-20">
                <h2 class="text-xl font-bold mb-5 flex items-center gap-2"><i class="fas fa-users-cog text-blue-600"></i> <span data-i18n="admin_area">Gestione Utenze</span></h2>
                <div class="mobile-card border-t-4 border-t-blue-500">
                    <h3 class="font-semibold mb-4" data-i18n="new_user">Nuovo Utente</h3>
                    <div>
                        <label class="text-xs font-semibold uppercase tracking-wider ml-1" style="color: var(--text-muted);" data-i18n="name_label">Nome e Cognome</label>
                        <input type="text" id="add-user-name" class="mobile-input">
                    </div>
                    <div class="mt-4">
                        <label class="text-xs font-semibold uppercase tracking-wider ml-1" style="color: var(--text-muted);" data-i18n="email_label">Indirizzo Email</label>
                        <input type="email" id="add-user-email" class="mobile-input" style="direction: ltr; text-align: left;">
                    </div>
                    <div class="mt-4">
                        <label class="text-xs font-semibold uppercase tracking-wider ml-1" style="color: var(--text-muted);" data-i18n="role_label">Ruolo</label>
                        <select id="add-user-role" class="mobile-input">
                            <option value="student" data-i18n="role_student">Studente</option>
                            <option value="teacher" data-i18n="role_teacher">Docente</option>
                            <option value="admin" data-i18n="role_admin">Amministratore</option>
                        </select>
                    </div>
                    <button onclick="addUser()" class="btn-touch w-full mt-6 bg-blue-600 text-white font-medium py-3 rounded-xl" data-i18n="btn_register">Registra Utente</button>
                </div>
                <h3 class="font-semibold mt-8 mb-4 ml-1" data-i18n="reg_users">Utenti Registrati</h3>
                <div id="admin-users-list" class="space-y-3"></div>
            </div>

            <!-- [2] الواجبات للمعلم -->
            <div id="view-homework-manage" class="hidden-section pb-20">
                <div class="flex p-1 rounded-xl mb-6" style="background: var(--border-color);">
                    <button onclick="switchTeacherTab('publish')" id="tab-t-publish" class="flex-1 py-2 font-medium rounded-lg text-sm bg-white text-blue-600 shadow-sm" data-i18n="tab_assign">Assegna Compito</button>
                    <button onclick="switchTeacherTab('track')" id="tab-t-track" class="flex-1 py-2 font-medium rounded-lg text-sm text-slate-500 bg-transparent" data-i18n="tab_track">Consegne</button>
                </div>

                <div id="teacher-publish-view">
                    <div class="mobile-card border-t-4 border-t-indigo-500">
                        <div>
                            <label class="text-xs font-semibold uppercase tracking-wider ml-1" style="color: var(--text-muted);" data-i18n="task_title">Titolo dell'Attività</label>
                            <input type="text" id="hw-title" class="mobile-input">
                        </div>
                        <div class="mt-4">
                            <label class="text-xs font-semibold uppercase tracking-wider ml-1" style="color: var(--text-muted);" data-i18n="deadline">Data di Scadenza</label>
                            <input type="date" id="hw-date" class="mobile-input">
                        </div>
                        <div class="mt-4">
                            <label class="text-xs font-semibold uppercase tracking-wider ml-1" style="color: var(--text-muted);" data-i18n="class_label">Classe</label>
                            <select id="hw-grade" class="mobile-input">
                                <!-- سيتم ملؤه بواسطة الجافاسكريبت حسب اللغة -->
                            </select>
                        </div>
                        <div class="mt-4">
                            <label class="text-xs font-semibold uppercase tracking-wider ml-1" style="color: var(--text-muted);" data-i18n="subject_label">Materia</label>
                            <select id="hw-subject" class="mobile-input">
                                <!-- سيتم ملؤه بواسطة الجافاسكريبت حسب اللغة -->
                            </select>
                        </div>
                        <div class="mt-4">
                            <label class="text-xs font-semibold uppercase tracking-wider ml-1" style="color: var(--text-muted);" data-i18n="instructions">Istruzioni</label>
                            <textarea id="hw-desc" rows="3" class="mobile-input resize-none"></textarea>
                        </div>
                        <button onclick="addHomework()" class="btn-touch w-full mt-6 bg-indigo-600 text-white font-medium py-3 rounded-xl shadow-sm" data-i18n="btn_publish">Pubblica Attività</button>
                    </div>
                </div>
                <div id="teacher-track-view" class="hidden-section"><div id="teacher-hw-list" class="space-y-4"></div></div>
            </div>

            <!-- [3] الجدول -->
            <div id="view-schedule-manage" class="hidden-section pb-20">
                <h2 class="text-xl font-bold mb-5 flex items-center gap-2"><i class="far fa-calendar-alt text-emerald-500"></i> <span data-i18n="schedule_title">Orario delle Lezioni</span></h2>
                <div id="schedule-controls" class="mobile-card border-t-4 border-t-emerald-500 mb-6">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-semibold uppercase" style="color: var(--text-muted);" data-i18n="day_label">Giorno</label>
                            <select id="sch-day" class="mobile-input py-2 mt-1"></select>
                        </div>
                        <div>
                            <label class="text-xs font-semibold uppercase" style="color: var(--text-muted);" data-i18n="hour_label">Ora</label>
                            <select id="sch-slot" class="mobile-input py-2 mt-1"></select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <label class="text-xs font-semibold uppercase" style="color: var(--text-muted);" data-i18n="subj_class">Materia e Classe</label>
                        <input type="text" id="sch-subject" class="mobile-input py-2 mt-1">
                    </div>
                    <div class="flex gap-2 mt-4">
                        <button onclick="addScheduleSlot()" class="btn-touch flex-grow bg-emerald-600 text-white font-medium py-2 rounded-xl" data-i18n="btn_save">Salva Modifica</button>
                        <button onclick="clearSchedule()" class="btn-touch w-12 bg-red-50 text-red-500 border border-red-200 rounded-xl"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
                <h3 class="font-semibold mb-3 ml-1" data-i18n="current_schedule">Orario Attuale</h3>
                <div id="manage-schedule-container"></div>
            </div>

            <!-- [4] الطالب -->
            <div id="view-student" class="hidden-section pb-20">
                <div class="flex p-1 rounded-xl mb-6" style="background: var(--border-color);">
                    <button onclick="switchStudentTab('hw')" id="tab-hw" class="flex-1 py-2 font-medium rounded-lg text-sm bg-white text-blue-600 shadow-sm" data-i18n="tab_assigned">Attività Assegnate</button>
                    <button onclick="switchStudentTab('sch')" id="tab-sch" class="flex-1 py-2 font-medium rounded-lg text-sm text-slate-500 bg-transparent" data-i18n="tab_schedule">Orario Lezioni</button>
                </div>
                <div id="student-hw-list" class="space-y-4"></div>
                <div id="student-schedule-view" class="hidden-section"><div id="display-schedule-container"></div></div>
            </div>
        </main>
        
        <nav id="bottom-nav" class="bottom-nav"></nav>
    </div>

    <!-- النوافذ المنبثقة -->
    <div id="submit-sheet" class="bottom-sheet-overlay">
        <div class="bottom-sheet-content">
            <div class="sheet-handle"></div>
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold" data-i18n="submit_task">Consegna Elaborato</h3>
                <button onclick="closeSheet('submit-sheet')" class="icon-btn btn-touch"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-5">
                <div class="p-3 rounded-xl" style="background: var(--input-bg); border: 1px solid var(--border-color);"><p id="sheet-hw-title" class="font-medium text-blue-600 text-sm"></p></div>
                <div>
                    <label class="block font-medium text-sm mb-2" data-i18n="text_note">Testo / Note:</label>
                    <textarea id="submit-text" class="mobile-input resize-none" rows="4"></textarea>
                </div>
                <div>
                    <label class="block font-medium text-sm mb-2" data-i18n="attach_file">Allega File:</label>
                    <div class="relative border-2 border-dashed rounded-xl p-5 text-center transition cursor-pointer" style="border-color: var(--border-color); background: var(--input-bg);">
                        <input type="file" id="submit-file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="updateFileName(this)" accept=".pdf, image/*">
                        <i class="fas fa-cloud-upload-alt text-2xl mb-2" style="color: var(--text-muted);"></i>
                        <p id="file-name-display" class="text-sm font-medium text-blue-600" data-i18n="tap_file">Tocca per selezionare un file</p>
                    </div>
                </div>
                <button id="confirm-submit-btn" onclick="confirmSubmission()" class="btn-touch w-full bg-emerald-600 text-white font-medium py-3.5 rounded-xl mt-2" data-i18n="btn_send">Invia Consegna</button>
            </div>
        </div>
    </div>

    <div id="teacher-view-sheet" class="bottom-sheet-overlay">
        <div class="bottom-sheet-content" style="max-height: 95vh; display: flex; flex-direction: column;">
            <div class="sheet-handle"></div>
            <div class="flex justify-between items-center mb-4 pb-3 shrink-0" style="border-bottom: 1px solid var(--border-color);">
                <h3 class="text-lg font-bold text-blue-600" data-i18n="teacher_view_subs">Elaborati Ricevuti</h3>
                <button onclick="closeSheet('teacher-view-sheet')" class="icon-btn btn-touch"><i class="fas fa-times"></i></button>
            </div>
            <div id="submissions-container" class="space-y-3 overflow-y-auto flex-grow pb-10"></div>
        </div>
    </div>

    <div id="file-viewer-modal" class="bottom-sheet-overlay" style="z-index: 2000;">
        <div class="bottom-sheet-content" style="height: 95vh; display: flex; flex-direction: column; padding: 1.5rem 1rem;">
            <div class="sheet-handle"></div>
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h3 class="font-bold truncate pr-2" data-i18n="file_viewer">Visualizzatore</h3>
                <button onclick="closeSheet('file-viewer-modal')" class="px-3 py-1.5 rounded-lg text-sm font-medium btn-touch" style="background: var(--input-bg); border: 1px solid var(--border-color);" data-i18n="close">Chiudi</button>
            </div>
            <div id="file-viewer-container" class="flex-grow w-full rounded-xl overflow-hidden flex items-center justify-center" style="background: var(--input-bg);"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
